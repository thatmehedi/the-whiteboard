<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canvas Corner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header>
        <div class="brand"><span class="brand-mark">✦</span>Canvas Corner</div>
        <p>Sketch, write, and let ideas wander.</p>
        <button id="download" class="outline-button" type="button">↓ Save PNG</button>
      </header>
      <section class="board-wrap" aria-label="Whiteboard">
        <canvas id="board" aria-label="Drawing canvas"></canvas>
        <div id="emptyHint" class="empty-hint">Pick a tool and make your first mark</div>
      </section>
      <nav class="toolbar" aria-label="Whiteboard tools">
        <div class="tool-group" aria-label="Tools">
          <button class="tool active" data-tool="pen" title="Pen (P)">✎<span>Pen</span></button>
          <button class="tool" data-tool="eraser" title="Eraser (E)">⌫<span>Erase</span></button>
          <button class="tool" data-tool="text" title="Text (T)">T<span>Text</span></button>
        </div>
        <div class="tool-group" aria-label="Colors">
          <button class="swatch active" data-color="#242328" style="--swatch:#242328" aria-label="Ink black"></button>
          <button class="swatch" data-color="#ef5e52" style="--swatch:#ef5e52" aria-label="Coral red"></button>
          <button class="swatch" data-color="#4777d7" style="--swatch:#4777d7" aria-label="Blue"></button>
          <button class="swatch" data-color="#39a67d" style="--swatch:#39a67d" aria-label="Green"></button>
          <button class="swatch" data-color="#f3a834" style="--swatch:#f3a834" aria-label="Orange"></button>
          <button class="swatch" data-color="#9b59b6" style="--swatch:#9b59b6" aria-label="Purple"></button>
          <button class="swatch" data-color="#e84393" style="--swatch:#e84393" aria-label="Hot Pink"></button>
          <button class="swatch" data-color="#00b894" style="--swatch:#00b894" aria-label="Mint Teal"></button>
          <button class="swatch" data-color="#636e72" style="--swatch:#636e72" aria-label="Slate Gray"></button>
        </div>
        <label class="size-control" for="size">Size <input id="size" type="range" min="1" max="30" value="5" /><span id="sizeValue">5px</span></label>
        <button id="undo" class="icon-button" type="button" title="Undo (Ctrl+Z)">↶</button>
        <button id="clear" class="icon-button danger" type="button" title="Clear board">×</button>
      </nav>
    </main>
    <script src="app.js"></script>
  </body>
</html>
